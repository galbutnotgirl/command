name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # FluidAudio (a dependency of the executable target, pulled in when
      # resolving the package graph even though tests don't touch it) needs
      # Swift 6 tools — macos-14's default Xcode only has Swift 5.10.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Critical regression contract audit
        run: python3 ./test/test-regression-contracts.py

      - name: Runtime change regression impact
        env:
          REGRESSION_IMPACT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          ./test/test-regression-impact.sh
          if [[ -z "$REGRESSION_IMPACT_BASE" || "$REGRESSION_IMPACT_BASE" == "0000000000000000000000000000000000000000" ]]; then
            python3 ./test/test-regression-impact.py --audit-only
          else
            python3 ./test/test-regression-impact.py --base "$REGRESSION_IMPACT_BASE"
          fi

      - name: Swift unit tests (ClaudeCommandCoreTests)
        working-directory: agent
        run: swift test

      - name: Native Clipboard History helper smoke test
        run: |
          swift build --package-path agent --product CommandClipboardWatcher
          ./test/test-clipboard-watcher.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Node tests (vendored capture core)
        working-directory: vendor/claude-command-capture
        run: node --test

      - name: Shell tests (prompt/context matching)
        run: ./test/test-shell.sh

      - name: Transactional app build tests
        run: ./test/test-build-transaction.sh

      - name: Transactional release package tests
        run: ./test/test-release-transaction.sh

      - name: Fresh and incremental install state tests
        run: ./test/test-install-state.sh

      - name: Uninstall ownership and permission-reset tests
        run: ./test/test-uninstall.sh

      - name: Updater install and rollback tests
        run: ./test/test-updater-swap.sh

      - name: Restart handoff tests
        run: ./test/test-restart-app.sh

      - name: Release signing policy tests
        run: ./test/test-release-policy.sh

      - name: Static syntax and configuration checks
        run: ./test/test-static-analysis.sh

      - name: Docs quality tests
        run: python3 ./test/test-docs.py

      - name: GitHub Pages quality tests
        run: python3 ./test/test-pages.py

      - name: String review round-trip tests
        run: python3 ./test/test_string_review.py

      - name: Repository whitespace checks
        run: git diff --check

      - name: Release asset smoke test
        run: |
          ./release.sh --skip-checks
          ./test/test-release-asset.sh
